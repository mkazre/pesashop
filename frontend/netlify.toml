[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  VITE_API_URL = "https://api.pesashop.com"

# SPA fallback — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Product video gallery embeds this page in an <iframe> (same-origin) to
# drive the YouTube IFrame Player API — the site-wide X-Frame-Options: DENY
# above blocks that, so allow same-origin framing for just this one page.
[[headers]]
  for = "/youtube-embed.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
